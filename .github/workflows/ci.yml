name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug paths
        run: |
          pwd
          ls -R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies        
        run: |
          python -m pip install --upgrade pip
          pip install -r ./projects/sim_creditFraud/requirements.txt

      - name: Lint code (flake8)        
        run: |
          pip install flake8
          flake8 ./projects/sim_creditFraud/src ./projects/sim_creditFraud/tests || true

      - name: Run tests (pytest)        
        run: |
          pip install pytest
          PYTHONPATH=./projects/sim_creditFraud pytest ./projects/sim_creditFraud
