name: CI Pipeline

on:
  push:
    branches: [main, dev, feature_template]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project:
          - sim_creditFraud
          - ml_template

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug paths
        run: |
          echo "Running project: ${{ matrix.project }}"
          pwd
          ls -R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./projects/${{ matrix.project }}/requirements.txt

      - name: Lint code (flake8)
        run: |
          pip install flake8
          flake8 ./projects/${{ matrix.project }}/src ./projects/${{ matrix.project }}/tests || true

      - name: Run tests (pytest)
        run: |
          pip install pytest
          PYTHONPATH=./projects/${{ matrix.project }} pytest ./projects/${{ matrix.project }}
          
      - name: Build Docker image (sim_creditFraud only)
        if: matrix.project == 'sim_creditFraud'
        run: |
          docker build -t sim-credit-fraud ./projects/sim_creditFraud
            
