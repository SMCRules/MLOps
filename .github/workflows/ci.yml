name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
      	working-directory: projects/sim_creditFraud
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code (flake8)
        run: |
          pip install flake8
          flake8 src tests

      - name: Run tests (pytest)
      	working-directory: projects/sim_creditFraud
        run: |
          pip install pytest
          pytest -q
          
      - name: Build Docker image      
      	working-directory: projects/sim_creditFraud
        run: |
          docker build -t sim-credit-fraud .
